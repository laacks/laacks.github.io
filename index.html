<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Elven Temple Ruins — Day</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; background: #87ceeb; }
    #instructions {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.5); color: #ffe8a0; font-family: monospace;
      font-size: 13px; padding: 10px 20px; border-radius: 6px;
      border: 1px solid rgba(255,220,100,0.3); pointer-events: none;
      text-align: center; z-index: 999; transition: opacity 1s;
    }
  </style>

  <script>
    // ─── TERRAIN FOLLOW COMPONENT ────────────────────────────────────────────
    // Raycasts downward from the player each frame and smoothly adjusts
    // the rig Y so the player steps up onto platforms, stairs, and rubble.
    AFRAME.registerComponent('terrain-follow', {
      schema: {
        eyeHeight:  { default: 1.6 },
        maxStep:    { default: 0.8 },
        smoothing:  { default: 0.12 },
        rayOriginY: { default: 3.0 }
      },

      init: function () {
        this.raycaster = new THREE.Raycaster();
        this.down      = new THREE.Vector3(0, -1, 0);
        this.origin    = new THREE.Vector3();
        this.targetY   = null;
      },

      tick: function () {
        const rig = this.el;
        const pos = rig.object3D.position;

        this.origin.set(pos.x, pos.y + this.data.rayOriginY, pos.z);
        this.raycaster.set(this.origin, this.down);

        const meshes = [];
        this.el.sceneEl.object3D.traverse(obj => {
          if (obj.isMesh) meshes.push(obj);
        });

        const hits = this.raycaster.intersectObjects(meshes, false);
        if (hits.length > 0) {
          const surfaceY = hits[0].point.y;

          if (this.targetY === null) {
            this.targetY = surfaceY;
          } else {
            const delta = surfaceY - this.targetY;
            // Clamp upward steps to avoid snapping up walls
            this.targetY += delta > this.data.maxStep ? this.data.maxStep : delta;
          }

          pos.y += (this.targetY - pos.y) * this.data.smoothing;
        }
      }
    });
  </script>
</head>
<body>

<div id="instructions">
  Desktop: WASD to move · Mouse to look &nbsp;|&nbsp; Quest: Left stick = move · Right stick = turn
</div>

<a-scene
  fog="type: exponential; color: #c8ddb0; density: 0.010"
  shadow="type: pcfsoft"
  renderer="antialias: true; colorManagement: true"
>

  <!-- ===== CAMERA + CONTROLS ===== -->
  <a-entity
    id="rig"
    position="0 0 12"
    movement-controls="controls: gamepad, keyboard; speed: 0.15; fly: false"
    terrain-follow="eyeHeight: 1.6; smoothing: 0.12; maxStep: 0.6"

    <a-camera look-controls="pointerLockEnabled: true" position="0 1.6 0">
      <a-cursor color="#ffeeaa" opacity="0.4" raycaster="enabled: false"></a-cursor>
    </a-camera>
    <a-entity oculus-touch-controls="hand: left"></a-entity>
    <a-entity oculus-touch-controls="hand: right"></a-entity>

  <!-- ===== SKY ===== -->
  <a-sky color="#7ec8e3"></a-sky>

  <!-- Sun -->
  <a-sphere position="40 60 -80" radius="6"
    color="#fff8e0"
    material="emissive:#fffacc; emissiveIntensity:1; shader:flat">

  <!-- Clouds -->
  <a-sphere position="-25 28 -60" radius="5"  color="#ffffff" material="roughness:1; opacity:0.92; transparent:true"></a-sphere>
  <a-sphere position="-18 27 -60" radius="7"  color="#f8f8f8" material="roughness:1; opacity:0.88; transparent:true"></a-sphere>
  <a-sphere position="-10 29 -58" radius="4"  color="#ffffff" material="roughness:1; opacity:0.85; transparent:true"></a-sphere>
  <a-sphere position="15  26 -65" radius="6"  color="#f0f0f0" material="roughness:1; opacity:0.88; transparent:true"></a-sphere>
  <a-sphere position="22  28 -64" radius="4"  color="#ffffff" material="roughness:1; opacity:0.9;  transparent:true"></a-sphere>
  <a-sphere position="30  25 -70" radius="8"  color="#f8f8f8" material="roughness:1; opacity:0.82; transparent:true"></a-sphere>

  <!-- ===== LIGHTING ===== -->
  <a-light type="directional" color="#fff5cc" intensity="1.8"
    position="6 12 4" cast-shadow="true"
    shadow-camera-left="-20" shadow-camera-right="20"
    shadow-camera-top="20"   shadow-camera-bottom="-20">
  </a-light>
  <a-light type="ambient"     color="#a8c8e8" intensity="0.9"></a-light>
  <a-light type="hemisphere"  color="#d4e8a0" ground-color="#8aaa60" intensity="0.4"></a-light>

  <!-- ===== GROUND ===== -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="120" height="120"
    color="#5a7a3a" material="roughness:1; metalness:0" shadow="receive:true">
  </a-plane>

  <!-- Grass / moss patches -->
  <a-plane position="4  0.01  5"  rotation="-90 0 20"  width="4" height="3" color="#4a7030" material="roughness:1; opacity:0.9; transparent:true"></a-plane>
  <a-plane position="-6 0.01  3"  rotation="-90 0 -10" width="3" height="4" color="#527838" material="roughness:1; opacity:0.8; transparent:true"></a-plane>
  <a-plane position="1  0.01 -8"  rotation="-90 0 40"  width="5" height="3" color="#4e7434" material="roughness:1; opacity:0.9; transparent:true"></a-plane>
  <a-plane position="-8 0.01 -5"  rotation="-90 0 15"  width="4" height="4" color="#4a6e30" material="roughness:1; opacity:0.85; transparent:true"></a-plane>
  <a-plane position="8  0.01 -3"  rotation="-90 0 -25" width="3" height="3" color="#567a3c" material="roughness:1; opacity:0.8; transparent:true"></a-plane>

  <!-- ===== TEMPLE STEPS ===== -->
  <a-box position="0 0.1 4"  width="10"  height="0.2" depth="2"   color="#c8b888" material="roughness:1" shadow="receive:true"></a-box>
  <a-box position="0 0.3 3"  width="9.2" height="0.2" depth="1.8" color="#c0b080" material="roughness:1" shadow="receive:true"></a-box>
  <a-box position="0 0.5 2"  width="8.5" height="0.2" depth="1.8" color="#b8a878" material="roughness:1" shadow="receive:true"></a-box>

  <!-- ===== TEMPLE FLOOR ===== -->
  <a-box position="0 0.6 -2" width="14" height="0.2" depth="12"
    color="#b0a070" material="roughness:1" shadow="receive:true">
  </a-box>
  <!-- Floor tile lines -->
  <a-box position="-2 0.71 -1" width="0.05" height="0.02" depth="6"   color="#887050" material="roughness:1"></a-box>
  <a-box position="2  0.71 -1" width="0.05" height="0.02" depth="6"   color="#887050" material="roughness:1"></a-box>
  <a-box position="0  0.71  1" width="8"    height="0.02" depth="0.05" color="#887050" material="roughness:1"></a-box>
  <a-box position="0  0.71 -1" width="8"    height="0.02" depth="0.05" color="#887050" material="roughness:1"></a-box>
  <a-box position="0  0.71 -3" width="8"    height="0.02" depth="0.05" color="#887050" material="roughness:1"></a-box>

  <!-- ===== COLUMNS — LEFT ===== -->
  <a-cylinder position="-5 2.3 0"  radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0  2.4 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <a-cylinder position="-5 2.3 -3" radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0  2.4 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <!-- Broken left column -->
  <a-cylinder position="-5 1.5 -6" radius="0.4" height="2.8" color="#a89860" material="roughness:1" rotation="0 0 8" shadow="cast:true">
    <a-cylinder position="0 -1.5 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <!-- Fallen column -->
  <a-cylinder position="-6.5 0.82 -7.5" radius="0.4" height="2.5" color="#a89860" material="roughness:1" rotation="0 30 90" shadow="cast:true"></a-cylinder>

  <!-- ===== COLUMNS — RIGHT ===== -->
  <a-cylinder position="5 2.3 0"  radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">

    <a-cylinder position="0 -2.4 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>

  <a-cylinder position="5 2.3 -3" radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">

    <a-cylinder position="0 -2.4 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <!-- Broken right column -->
  <a-cylinder position="5 1.9 -6" radius="0.4" height="3.5" color="#a89860" material="roughness:1" rotation="0 0 -5" shadow="cast:true">
    <a-cylinder position="0 -1.8 0"  radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>

  <!-- ===== ARCHITRAVE ===== -->
  <a-box position="0 4.7 0"  width="11" height="0.5" depth="0.9" color="#b8a868" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="1 4.4 -3" width="9"  height="0.5" depth="0.9" color="#a89858" material="roughness:1" rotation="0 0 -4"></a-box>

  <!-- ===== BACK WALL ===== -->
  <a-box position="-3 2 -7.5"   width="5" height="4" depth="0.7" color="#a89858" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="4  1.5 -7.5" width="3" height="3" depth="0.7" color="#a08850" material="roughness:1"></a-box>
  <!-- Vines on wall -->
  <a-box position="-1   2.5 -7.1" width="0.08" height="4" depth="0.08" color="#3a8030" material="roughness:1" rotation="0 0 12"></a-box>
  <a-box position="-3.5 1.8 -7.1" width="0.08" height="3" depth="0.08" color="#448836" material="roughness:1" rotation="0 0 -8"></a-box>
  <a-box position="1.5  1.2 -7.1" width="0.08" height="2" depth="0.08" color="#3a7828" material="roughness:1" rotation="0 0 5"></a-box>

  <!-- ===== RUBBLE ===== -->
  <a-box position="-6.5 0.82 -7.5" width="1.5" height="0.8" depth="1.2" color="#908060" material="roughness:1" rotation="0 10 0"  shadow="cast:true"></a-box>
  <a-box position="7    0.82 -7"   width="1.2" height="0.7" depth="1.0" color="#988868" material="roughness:1" rotation="0 20 0"></a-box>
  <a-box position="6    0.72 -6"   width="0.8" height="0.5" depth="0.8" color="#887858" material="roughness:1" rotation="0 40 0"></a-box>
  <a-box position="3    0.72  2"   width="1.2" height="0.5" depth="0.9" color="#908060" material="roughness:1" rotation="0 25 0"  shadow="cast:true"></a-box>
  <a-box position="-4   0.72  1"   width="1.0" height="0.4" depth="0.8" color="#887858" material="roughness:1" rotation="0 10 5"></a-box>
  <a-box position="2    0.72 -4"   width="0.9" height="0.6" depth="0.7" color="#908060" material="roughness:1" rotation="0 60 0"></a-box>
  <a-box position="-3   0.72 -4"   width="1.1" height="0.5" depth="1.0" color="#887858" material="roughness:1" rotation="0 -15 3"></a-box>
  <a-box position="6    0.72 -1"   width="0.8" height="0.4" depth="0.9" color="#807050" material="roughness:1" rotation="0 45 0"></a-box>
  <a-box position="-6   0.72 -2"   width="1.0" height="0.5" depth="0.8" color="#807050" material="roughness:1" rotation="0 30 -5"></a-box>

  <!-- ===== ALTAR ===== -->
  <a-box position="0 0.9 -6" width="3"   height="0.6" depth="1.5" color="#a09060" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="0 1.3 -6" width="2.5" height="0.5" depth="1.2" color="#b0a070" material="roughness:1"></a-box>
  <!-- Spinning golden gem -->
  <a-sphere position="0 1.65 -6" radius="0.18"
    color="#ffd700"
    material="emissive:#ffaa00; emissiveIntensity:0.6; roughness:0; metalness:0.8"
    animation__float="property: position; to: 0 1.82 -6; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine"
    animation__spin="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
  </a-sphere>
  <a-light type="point" color="#ffcc44" intensity="0.5" distance="6" position="0 2.2 -6"

  <!-- ===== VINES ON COLUMNS ===== -->
  <a-box position="-5.42 1.5  0"  width="0.07" height="3" depth="0.07" color="#4a8830" material="roughness:1" rotation="0 0  8"></a-box>
  <a-box position="-4.58 2   -3"  width="0.07" height="2" depth="0.07" color="#508a34" material="roughness:1" rotation="0 0 -5"></a-box>
  <a-box position="5.42  1.5  0"  width="0.07" height="3" depth="0.07" color="#4a8030" material="roughness:1" rotation="0 0 -8"></a-box>
  <a-box position="4.58  2   -3"  width="0.07" height="2" depth="0.07" color="#4a8830" material="roughness:1" rotation="0 0  4"></a-box>

  <!-- ===== TREES ===== -->
  <a-cylinder position="-10 3.5 -3"  radius="0.40" height="7"  color="#4a3020" material="roughness:1" shadow="cast:true"></a-cylinder>
  <a-sphere   position="-10 8   -3"  radius="3"    color="#2d6020" material="roughness:1"></a-sphere>
  <a-sphere   position="-11 7   -2"  radius="2.2"  color="#347028" material="roughness:1"></a-sphere>
  <a-sphere   position="-9  7.5 -4"  radius="1.8"  color="#285818" material="roughness:1"></a-sphere>

  <a-cylinder position="10  3   -3"  radius="0.35" height="6"  color="#4a3020" material="roughness:1" shadow="cast:true"></a-cylinder>
  <a-sphere   position="10  7   -3"  radius="2.8"  color="#306822" material="roughness:1"></a-sphere>
  <a-sphere   position="11  6   -2"  radius="2.0"  color="#387030" material="roughness:1"></a-sphere>

  <a-cylinder position="-16 5  -12"  radius="0.50" height="10" color="#3a2818" material="roughness:1"></a-cylinder>
  <a-sphere   position="-16 11 -12"  radius="4"    color="#245018" material="roughness:1"></a-sphere>
  <a-cylinder position="16  4  -12"  radius="0.45" height="8"  color="#3a2818" material="roughness:1"></a-cylinder>
  <a-sphere   position="16  9  -12"  radius="3.5"  color="#285a1e" material="roughness:1"></a-sphere>
  <a-cylinder position="-22 6  -20"  radius="0.60" height="12" color="#2e2010" material="roughness:1"></a-cylinder>
  <a-sphere   position="-22 13 -20"  radius="5"    color="#1e4410" material="roughness:1"></a-sphere>
  <a-cylinder position="20  5  -18"  radius="0.50" height="10" color="#2e2010" material="roughness:1"></a-cylinder>
  <a-sphere   position="20  11 -18"  radius="4.5"  color="#224812" material="roughness:1"></a-sphere>

  <!-- ===== TITLE ===== -->

    color="#fff8e0" width="8" font="mozillavr"
    animation="property: position; to: 0 6.3 0; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-text>

</a-scene>

<script>
  setTimeout(() => {
    const el = document.getElementById('instructions');
    if (el) el.style.opacity = '0';
  }, 8000);
</script>

</body>

  <a-box position="2 0.71 -1"  width="0.05" height="0.02" depth="6" color="#1a2a18" material="roughness:1"></a-box>
  <a-box position="0 0.71 1"   width="8"    height="0.02" depth="0.05" color="#1a2a18" material="roughness:1"></a-box>
  <a-box position="0 0.71 -1"  width="8"    height="0.02" depth="0.05" color="#1a2a18" material="roughness:1"></a-box>
  <a-box position="0 0.71 -3"  width="8"    height="0.02" depth="0.05" color="#1a2a18" material="roughness:1"></a-box>

  <!-- ===== COLUMNS (6 columns, 3 each side) ===== -->
  <!-- Left columns -->
  <a-cylinder position="-5 2.3 0"  radius="0.4" height="4.5" color="#2d4030" material="roughness:1" shadow="cast:true; receive:true">
    <a-cylinder position="0 2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder><!-- capital -->
    <a-cylinder position="0 -2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder><!-- base -->
  </a-cylinder>
  <a-cylinder position="-5 2.3 -3" radius="0.4" height="4.5" color="#2d4030" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0 2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <!-- Broken left column (shorter, tilted) -->
  <a-cylinder position="-5 1.5 -6" radius="0.4" height="2.8" color="#2a3a2a" material="roughness:1" rotation="0 0 8" shadow="cast:true">
    <a-cylinder position="0 -1.5 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <!-- Fallen column chunk -->
  <a-cylinder position="-6 0.85 -7.5" radius="0.4" height="2.5" color="#2a3a2a" material="roughness:1" rotation="0 30 90"></a-cylinder>

  <!-- Right columns -->
  <a-cylinder position="5 2.3 0"   radius="0.4" height="4.5" color="#2d4030" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0 2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <a-cylinder position="5 2.3 -3"  radius="0.4" height="4.5" color="#2d4030" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0 2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <!-- Broken right column -->
  <a-cylinder position="5 1.9 -6"  radius="0.4" height="3.5" color="#2a3a2a" material="roughness:1" rotation="0 0 -5" shadow="cast:true">
    <a-cylinder position="0 -1.8 0" radius="0.5" height="0.3" color="#253826" material="roughness:1"></a-cylinder>
  </a-cylinder>

  <!-- ===== ARCHITRAVE (beam across top of front columns) ===== -->
  <a-box position="0 4.7 0" width="11" height="0.5" depth="0.8" color="#263826" material="roughness:1" shadow="cast:true"></a-box>
  <!-- Partially collapsed back beam -->
  <a-box position="1 4.4 -3" width="9" height="0.5" depth="0.8" color="#222e22" material="roughness:1" rotation="0 0 -4"></a-box>

  <!-- ===== BACK WALL (partially standing) ===== -->
  <a-box position="-3 2 -7.5" width="5"  height="4" depth="0.6" color="#243224" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="4  1.5 -7.5" width="3" height="3" depth="0.6" color="#243224" material="roughness:1"></a-box>
  <!-- Rubble chunks at wall base -->
  <a-box position="-6 0.85 -7.5" width="1.5" height="0.8" depth="1.2" color="#1f2e1f" material="roughness:1"></a-box>
  <a-box position="7  0.85 -7"   width="1.2" height="0.7" depth="1.0" color="#1f2e1f" material="roughness:1" rotation="0 20 0"></a-box>
  <a-box position="6  0.75 -6"   width="0.8" height="0.5" depth="0.8" color="#1f2e1f" material="roughness:1" rotation="0 40 0"></a-box>

  <!-- ===== ALTAR ===== -->
  <a-box position="0 0.9 -6" width="3" height="0.6" depth="1.5" color="#2a3d2a" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="0 1.3 -6" width="2.5" height="0.5" depth="1.2" color="#2e4430" material="roughness:1"></a-box>
  <!-- Glowing altar gem -->
  <a-sphere position="0 1.65 -6" radius="0.18" color="#00ff88"
    material="emissive:#00ff88; emissiveIntensity:0.8; roughness:0; metalness:0.2"
    animation="property: position; to: 0 1.8 -6; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-sphere>
  <!-- Altar glow light -->
  <a-light type="point" color="#00ff88" intensity="0.6" distance="8" position="0 2 -6"
    animation="property: intensity; to: 1; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-light>

  <!-- ===== SCATTERED RUBBLE ===== -->
  <a-box position="3  0.75 2"   width="1.2" height="0.5" depth="0.9" color="#1e2e1e" material="roughness:1" rotation="0 25 0"></a-box>
  <a-box position="-4 0.75 1"   width="1.0" height="0.4" depth="0.8" color="#1e2e1e" material="roughness:1" rotation="0 10 5"></a-box>
  <a-box position="2  0.75 -4"  width="0.9" height="0.6" depth="0.7" color="#222e22" material="roughness:1" rotation="0 60 0"></a-box>
  <a-box position="-3 0.75 -4"  width="1.1" height="0.5" depth="1.0" color="#1e2e1e" material="roughness:1" rotation="0 -15 3"></a-box>
  <a-box position="6  0.75 -1"  width="0.8" height="0.4" depth="0.9" color="#1a2a1a" material="roughness:1" rotation="0 45 0"></a-box>
  <a-box position="-6 0.75 -2"  width="1.0" height="0.5" depth="0.8" color="#1a2a1a" material="roughness:1" rotation="0 30 -5"></a-box>

  <!-- ===== GLOWING VINES on columns ===== -->
  <!-- Vine strips (thin boxes with emissive green) -->
  <a-box position="-5.42 1.5 0"   width="0.06" height="3" depth="0.06" color="#00cc55" material="emissive:#003311; emissiveIntensity:0.4; roughness:1" rotation="0 0 8"></a-box>
  <a-box position="-4.58 2 -3"    width="0.06" height="2" depth="0.06" color="#00cc55" material="emissive:#003311; emissiveIntensity:0.3; roughness:1" rotation="0 0 -5"></a-box>
  <a-box position="5.42  1.5 0"   width="0.06" height="3" depth="0.06" color="#00aa44" material="emissive:#002211; emissiveIntensity:0.4; roughness:1" rotation="0 0 -8"></a-box>
  <a-box position="4.58  2 -3"    width="0.06" height="2" depth="0.06" color="#00cc55" material="emissive:#003311; emissiveIntensity:0.3; roughness:1" rotation="0 0 4"></a-box>
  <!-- Vine on back wall -->
  <a-box position="-1 2.5 -7.2"   width="0.06" height="4" depth="0.06" color="#00bb44" material="emissive:#002211; emissiveIntensity:0.5; roughness:1" rotation="0 0 15"></a-box>
  <a-box position="-3.5 1.5 -7.2" width="0.06" height="3" depth="0.06" color="#00cc55" material="emissive:#003311; emissiveIntensity:0.4; roughness:1" rotation="0 0 -10"></a-box>

  <!-- ===== FLOATING WISPS ===== -->
  <a-sphere position="-3 2 -2" radius="0.12" color="#88ffcc"
    material="emissive:#44ffaa; emissiveIntensity:0.9; opacity:0.8; transparent:true"
    animation__pos="property: position; to: -2.5 2.8 -1.5; dur: 3500; dir: alternate; loop: true; easing: easeInOutSine"
    animation__glow="property: material.emissiveIntensity; to: 0.3; dur: 2000; dir: alternate; loop: true">
  </a-sphere>
  <a-sphere position="4 1.8 -5" radius="0.10" color="#aaffdd"
    material="emissive:#55ffbb; emissiveIntensity:0.8; opacity:0.7; transparent:true"
    animation__pos="property: position; to: 3.5 2.5 -4.5; dur: 4200; dir: alternate; loop: true; easing: easeInOutSine"
    animation__glow="property: material.emissiveIntensity; to: 0.2; dur: 2500; dir: alternate; loop: true">
  </a-sphere>
  <a-sphere position="0 3 -3" radius="0.08" color="#ccffee"
    material="emissive:#66ffcc; emissiveIntensity:0.7; opacity:0.6; transparent:true"
    animation__pos="property: position; to: 0.5 3.5 -2; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-sphere>

  <!-- ===== ANCIENT TREES (flanking) ===== -->
  <!-- Left tree -->
  <a-cylinder position="-10 3 -3" radius="0.35" height="6" color="#1a2a18" material="roughness:1"></a-cylinder>
  <a-sphere   position="-10 7 -3" radius="2.5" color="#1a3a18" material="roughness:1; opacity:0.9; transparent:true"></a-sphere>
  <a-sphere   position="-11 6 -2" radius="1.8" color="#162e14" material="roughness:1; opacity:0.85; transparent:true"></a-sphere>
  <!-- Bioluminescent leaves -->
  <a-sphere position="-9.5 7.5 -2.5" radius="0.4" color="#00ff88" material="emissive:#00ff44; emissiveIntensity:0.3; opacity:0.6; transparent:true"></a-sphere>
  <a-sphere position="-10.5 8 -3.5" radius="0.3" color="#44ffaa" material="emissive:#00ff44; emissiveIntensity:0.3; opacity:0.5; transparent:true"></a-sphere>

  <!-- Right tree -->
  <a-cylinder position="10 3 -3"  radius="0.3"  height="5.5" color="#1a2a18" material="roughness:1"></a-cylinder>
  <a-sphere   position="10 7 -3"  radius="2.2"  color="#182e16" material="roughness:1; opacity:0.9; transparent:true"></a-sphere>
  <a-sphere   position="11 6 -2"  radius="1.6"  color="#1a3018" material="roughness:1; opacity:0.85; transparent:true"></a-sphere>
  <a-sphere   position="9.5 7.5 -2.5" radius="0.35" color="#00ff88" material="emissive:#00ff44; emissiveIntensity:0.3; opacity:0.6; transparent:true"></a-sphere>

  <!-- Background trees (atmosphere) -->
  <a-cylinder position="-14 4 -10" radius="0.4" height="8" color="#141e12" material="roughness:1"></a-cylinder>
  <a-sphere   position="-14 9 -10" radius="3"   color="#101e10" material="roughness:1; opacity:0.8; transparent:true"></a-sphere>
  <a-cylinder position="14 3.5 -10" radius="0.35" height="7" color="#141e12" material="roughness:1"></a-cylinder>
  <a-sphere   position="14 8 -10"  radius="2.8"  color="#0f1e0f" material="roughness:1; opacity:0.8; transparent:true"></a-sphere>

  <!-- ===== MIST EFFECT (low floating planes) ===== -->
  <a-plane position="0 0.3 0"  rotation="-90 0 0" width="30" height="30"
    color="#1a3322"
    material="opacity:0.15; transparent:true; roughness:1; side:double"
    animation="property: position; to: 0 0.6 0; dur: 6000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-plane>
  <a-plane position="0 0.5 -5" rotation="-90 10 0" width="20" height="15"
    color="#1a3322"
    material="opacity:0.1; transparent:true; roughness:1; side:double"
    animation="property: position; to: 0 0.8 -5; dur: 8000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-plane>

  <!-- ===== TITLE TEXT ===== -->
  <a-text
    value="Elven Temple Ruins"
    position="0 5.5 0"
    align="center"
    color="#88ffcc"
    width="8"
    font="mozillavr"
    material="emissive:#88ffcc; emissiveIntensity:0.3"
    animation="property: position; to: 0 5.8 0; dur: 4000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-text>

</a-scene>

<script>
  // Hide instructions after 8 seconds
  setTimeout(() => {
    const el = document.getElementById('instructions');
    if (el) el.style.opacity = '0';
    el.style.transition = 'opacity 1s';
  }, 8000);
</script>

</body>
</html>
