<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Elven Ruins</title>
  <script>
  // Unregister any service workers that may be caching old versions
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => reg.unregister());
    });
  }
</script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script>
    AFRAME.registerComponent('player-move', {
      schema: {
        speed:      { default: 2.5 },
        turnSpeed:  { default: 60  },
        stepHeight: { default: 0.31 },
        jumpHeight: { default: 0.61 },
        gravity:    { default: 9.8  }
      },
      init: function () {
        this.vel      = 0;
        this.grounded = true;
        this.prevA    = false;
        this.meshes   = [];
        // All THREE objects initialized as null — created on first tick
        this.downRay  = null;
        this.fwdRay   = null;
        this.fwdDir   = null;
        this.downOrig = null;
        this.fwdOrig  = null;
        this.DOWN     = null;

        this.el.sceneEl.addEventListener('loaded', () => {
          setTimeout(() => {
            this.el.sceneEl.object3D.traverse(o => {
              if (o.isMesh) this.meshes.push(o);
            });
          }, 500);
        });
      },

      tick: function (t, dt) {
        if (!dt) return;

        // Create THREE objects on first tick — guaranteed safe
        if (!this.downRay) {
          this.downRay  = new THREE.Raycaster();
          this.fwdRay   = new THREE.Raycaster();
          this.fwdDir   = new THREE.Vector3();
          this.downOrig = new THREE.Vector3();
          this.fwdOrig  = new THREE.Vector3();
          this.DOWN     = new THREE.Vector3(0, -1, 0);
          return; // skip rest of tick on init frame
        }

        const sec = dt / 1000;
        const rig = this.el.object3D;
        const pos = rig.position;

        // Read XR input
        let mx = 0, mz = 0, turn = 0, jumpBtn = false;
        const session = this.el.sceneEl.xrSession;
        if (session) {
          for (const src of session.inputSources) {
            if (!src.gamepad) continue;
            const ax = src.gamepad.axes;
            const bt = src.gamepad.buttons;
            if (src.handedness === 'left') {
              if (ax.length > 3) {
                if (Math.abs(ax[2]) > 0.15) mx += ax[2];
                if (Math.abs(ax[3]) > 0.15) mz += ax[3];
              }
            } else if (src.handedness === 'right') {
              if (ax.length > 2 && Math.abs(ax[2]) > 0.15) turn += ax[2];
              if (bt && bt[4] && bt[4].pressed) jumpBtn = true;
            }
          }
        }

        // Turn
        if (turn !== 0) {
          rig.rotation.y -= turn * THREE.MathUtils.degToRad(this.data.turnSpeed) * sec;
        }

        // Movement direction = rig yaw + camera yaw
        const cam = this.el.querySelector('[camera]');
        const camYaw = cam ? cam.object3D.rotation.y : 0;
        const yaw = rig.rotation.y + camYaw;
        const cos = Math.cos(yaw), sin = Math.sin(yaw);
        const wx =  mx * cos + mz * sin;
        const wz = -mx * sin + mz * cos;

        // Move with collision
        if (wx !== 0 || wz !== 0) {
          const spd = this.data.speed * sec;
          if (!this.blocked(pos, wx, wz)) {
            pos.x += wx * spd;
            pos.z += wz * spd;
          } else {
            if (!this.blocked(pos, wx, 0))  pos.x += wx * spd;
            if (!this.blocked(pos, 0,  wz)) pos.z += wz * spd;
          }
        }

        // Jump
        if (jumpBtn && !this.prevA && this.grounded) {
          this.vel = Math.sqrt(2 * this.data.gravity * this.data.jumpHeight);
          this.grounded = false;
        }
        this.prevA = jumpBtn;

        // Gravity / terrain
        const ground = this.groundAt(pos.x, pos.z, pos.y + 5);
        if (!this.grounded) {
          this.vel -= this.data.gravity * sec;
          pos.y += this.vel * sec;
          if (ground !== null && pos.y <= ground) {
            pos.y = ground;
            this.vel = 0;
            this.grounded = true;
          }
        } else {
          if (ground !== null) {
            const diff = ground - pos.y;
            if (diff > 0 && diff <= this.data.stepHeight) {
              pos.y += diff * 0.2;
            } else if (diff < 0) {
              pos.y += diff * 0.2;
            }
          }
        }
      },

      groundAt: function (x, z, fromY) {
        if (!this.downRay) return null;
        this.downOrig.set(x, fromY, z);
        this.downRay.set(this.downOrig, this.DOWN);
        const hits = this.downRay.intersectObjects(this.meshes, false);
        for (const h of hits) {
          if (h.point.y < fromY - 0.01) return h.point.y;
        }
        return null;
      },

      blocked: function (pos, wx, wz) {
        if (!this.fwdRay) return false;
        // Fire from head height, angled 25° downward into movement direction.
        // The hit point Y reveals obstacle height — block if above stepHeight.
        this.fwdDir.set(wx, -0.47, wz).normalize(); // tan(25°) ≈ 0.47
        this.fwdOrig.set(pos.x, pos.y + 1.7, pos.z);
        this.fwdRay.set(this.fwdOrig, this.fwdDir);
        this.fwdRay.near = 0;
        this.fwdRay.far  = 1.2; // longer to compensate for diagonal
        const hits = this.fwdRay.intersectObjects(this.meshes, false);
        if (hits.length === 0) return false;
        return hits[0].point.y > pos.y + this.data.stepHeight;
      }
    });

    AFRAME.registerComponent('sword-pickup', {
      schema: { grabDist: { default: 0.6 } },
      init: function () {
        this.held        = false;
        this.triggerDown = false;
        this.controller  = null;
        this.homePos     = null;
        this.homeRot     = null;
        this.el.sceneEl.addEventListener('loaded', () => {
          setTimeout(() => {
            this.controller = document.querySelector('#rc');
            this.homePos = this.el.object3D.position.clone();
            this.homeRot = this.el.object3D.rotation.clone();
          }, 500);
        });
      },
      tick: function () {
        if (!this.controller || !this.homePos) return;
        let trig = false;
        const session = this.el.sceneEl.xrSession;
        if (session) {
          for (const src of session.inputSources) {
            if (src.handedness === 'right' && src.gamepad) {
              const b = src.gamepad.buttons[0];
              if (b && b.value > 0.5) trig = true;
            }
          }
        }
        const sp = new THREE.Vector3();
        const cp = new THREE.Vector3();
        this.el.object3D.getWorldPosition(sp);
        this.controller.object3D.getWorldPosition(cp);

        if (!this.held) {
          if (trig && !this.triggerDown && sp.distanceTo(cp) < this.data.grabDist) {
            this.held = true;
          }
        } else {
          const parent = this.el.object3D.parent;
          const cr = new THREE.Quaternion();
          this.controller.object3D.getWorldQuaternion(cr);
          const lp = cp.clone();
          parent.worldToLocal(lp);
          this.el.object3D.position.copy(lp);
          const pq = new THREE.Quaternion();
          parent.getWorldQuaternion(pq);
          pq.invert();
          const lq = pq.multiply(cr);
          lq.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0)));
          this.el.object3D.quaternion.copy(lq);
          if (!trig && this.triggerDown) {
            this.held = false;
            this.el.object3D.position.copy(this.homePos);
            this.el.object3D.rotation.copy(this.homeRot);
          }
        }
        this.triggerDown = trig;
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a2a1a; }
    #splash {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(175deg, #8fc4d4 0%, #b8d4a8 50%, #7aab6a 100%);
      transition: opacity 1s ease;
    }
    #splash.fade { opacity: 0; pointer-events: none; }
    #splash h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: #2a3a1a; letter-spacing: 0.2em;
      text-shadow: 0 2px 12px rgba(255,255,255,0.4);
      margin-bottom: 0.4rem;
    }
    #splash p {
      font-family: Georgia, serif; color: #3a5a2a;
      font-size: 1rem; letter-spacing: 0.1em;
      margin-bottom: 3rem; font-style: italic;
    }
    #vrbtn {
      font-family: Georgia, serif; font-size: 1.1rem;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: #f0ede0; background: #3a5a2a;
      border: 2px solid #5a8a4a; border-radius: 3px;
      padding: 1rem 3.5rem; cursor: pointer;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
      transition: background 0.2s, transform 0.15s;
    }
    #vrbtn:hover { background: #4a7a3a; transform: translateY(-2px); }
    #version {
      margin-top: 1.5rem; font-family: monospace;
      font-size: 0.75rem; color: #4a6a3a; letter-spacing: 0.15em;
    }
  </style>
</head>

<script>
  const splash = document.getElementById('splash');
  const btn    = document.getElementById('vrbtn');
  const scene  = document.querySelector('a-scene');

  scene.addEventListener('loaded', () => {
    const nativeBtn = document.querySelector('.a-enter-vr');
    if (nativeBtn) nativeBtn.style.display = 'none';
  });

  btn.addEventListener('click', () => {
    if (scene.hasLoaded) {
      scene.enterVR().catch(e => console.warn('enterVR:', e));
    } else {
      scene.addEventListener('loaded', () => {
        scene.enterVR().catch(e => console.warn('enterVR:', e));
      }, { once: true });
    }
  });

  scene.addEventListener('enter-vr', () => {
    splash.classList.add('fade');
    setTimeout(() => { splash.style.display = 'none'; }, 1000);
  });

  scene.addEventListener('exit-vr', () => {
    splash.style.display = 'flex';
    splash.classList.remove('fade');
  });
</script>
