<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Elven Temple Ruins — Day</title>
  <!-- A-Frame MUST load first, then our components, then aframe-extras -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    // =========================================================
    // COMPONENTS — registered immediately after A-Frame loads,
    // before any <a-scene> is parsed.
    // =========================================================

    // ---------------------------------------------------------
    // 1. TERRAIN FOLLOW
    //    Raycasts down each frame, smoothly steps the rig up
    //    onto stairs, platform, and rubble.
    //    Mesh list is cached after scene loads to avoid
    //    traversing the whole graph every tick.
    // ---------------------------------------------------------
    AFRAME.registerComponent('terrain-follow', {
      schema: {
        maxStep:   { default: 0.5 },
        smoothing: { default: 0.15 }
      },
      init: function () {
        this.raycaster = new THREE.Raycaster();
        this.down      = new THREE.Vector3(0, -1, 0);
        this.origin    = new THREE.Vector3();
        this.targetY   = null;
        this.meshes    = null;

        // Cache meshes once the scene is fully loaded
        this.el.sceneEl.addEventListener('loaded', () => {
          this.meshes = [];
          this.el.sceneEl.object3D.traverse(obj => {
            if (obj.isMesh) this.meshes.push(obj);
          });
        });
      },
      tick: function () {
        if (!this.meshes || this.meshes.length === 0) return;

        const pos = this.el.object3D.position;
        // Cast from 4 units above the rig
        this.origin.set(pos.x, pos.y + 4, pos.z);
        this.raycaster.set(this.origin, this.down);

        const hits = this.raycaster.intersectObjects(this.meshes, false);
        if (hits.length === 0) return;

        const surfaceY = hits[0].point.y;
        if (this.targetY === null) {
          this.targetY = surfaceY;
        } else {
          const delta = surfaceY - this.targetY;
          // Allow stepping up by maxStep per frame; drop freely
          this.targetY += Math.min(delta, this.data.maxStep);
        }
        pos.y += (this.targetY - pos.y) * this.data.smoothing;
      }
    });

    // ---------------------------------------------------------
    // 2. VR THUMBSTICK LOCOMOTION
    //    In VR: reads axes from WebXR inputSources directly,
    //    which is the only reliable method in Quest browser.
    //    On desktop: WASD keyboard fallback.
    // ---------------------------------------------------------
    AFRAME.registerComponent('vr-locomotion', {
      schema: {
        speed:     { default: 3.0 },
        turnSpeed: { default: 1.5 }
      },
      init: function () {
        this.vec    = new THREE.Vector3();
        this.camera = null;
        this.isVR   = false;

        // Keyboard state
        this.keys = {};
        this._onKeyDown = (e) => { this.keys[e.code] = true; };
        this._onKeyUp   = (e) => { this.keys[e.code] = false; };
        window.addEventListener('keydown', this._onKeyDown);
        window.addEventListener('keyup',   this._onKeyUp);

        // Track VR mode
        this.el.sceneEl.addEventListener('enter-vr',  () => { this.isVR = true;  });
        this.el.sceneEl.addEventListener('exit-vr',   () => { this.isVR = false; });
      },

      remove: function () {
        window.removeEventListener('keydown', this._onKeyDown);
        window.removeEventListener('keyup',   this._onKeyUp);
      },

      tick: function (time, delta) {
        if (!delta) return;
        const dt = delta / 1000;
        const rig = this.el;

        if (!this.camera) {
          this.camera = rig.querySelector('[camera]');
          if (!this.camera) return;
        }

        let moveX = 0, moveZ = 0, turn = 0;

        if (this.isVR) {
          // --- WebXR input sources (Quest controllers in VR) ---
          const xrSession = this.el.sceneEl.xrSession;
          if (xrSession && xrSession.inputSources) {
            for (const source of xrSession.inputSources) {
              if (!source.gamepad) continue;
              const axes = source.gamepad.axes;
              if (source.handedness === 'left') {
                // Left stick: axes[2] = strafe, axes[3] = forward
                if (axes.length > 3) {
                  if (Math.abs(axes[2]) > 0.15) moveX += axes[2];
                  if (Math.abs(axes[3]) > 0.15) moveZ += axes[3];
                }
              } else if (source.handedness === 'right') {
                // Right stick: axes[2] = turn
                if (axes.length > 2) {
                  if (Math.abs(axes[2]) > 0.15) turn += axes[2];
                }
              }
            }
          }
        } else {
          // --- Keyboard fallback (desktop) ---
          if (this.keys['KeyW'] || this.keys['ArrowUp'])    moveZ -= 1;
          if (this.keys['KeyS'] || this.keys['ArrowDown'])  moveZ += 1;
          if (this.keys['KeyA'] || this.keys['ArrowLeft'])  moveX -= 1;
          if (this.keys['KeyD'] || this.keys['ArrowRight']) moveX += 1;
        }

        if (moveX === 0 && moveZ === 0 && turn === 0) return;

        // Turn
        if (turn !== 0) {
          rig.object3D.rotation.y -= turn * this.data.turnSpeed * dt;
        }

        // Move relative to where the player is facing
        const yaw = rig.object3D.rotation.y;
        const cos = Math.cos(yaw), sin = Math.sin(yaw);
        const wx = moveX * cos - moveZ * sin;
        const wz = moveX * sin + moveZ * cos;

        const spd = this.data.speed * dt;
        rig.object3D.position.x += wx * spd;
        rig.object3D.position.z += wz * spd;
      }
    });
  </script>

  <!-- aframe-extras only needed for oculus-touch-controls model rendering -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; background: #87ceeb; }
    #instructions {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.5); color: #ffe8a0; font-family: monospace;
      font-size: 13px; padding: 10px 20px; border-radius: 6px;
      border: 1px solid rgba(255,220,100,0.3); pointer-events: none;
      text-align: center; z-index: 999; transition: opacity 1s;
    }
  </style>
</head>
<body>

<div id="instructions">
  Desktop: WASD to move · Mouse to look &nbsp;|&nbsp; Quest: Left stick = move · Right stick = turn
</div>

<a-scene
  fog="type: exponential; color: #c8ddb0; density: 0.010"
  shadow="type: pcfsoft"
  renderer="antialias: true; colorManagement: true"
>

  <!-- ===== CAMERA + CONTROLS ===== -->
  <a-entity
    id="rig"
    position="0 0 12"
    vr-locomotion="speed: 3.0; turnSpeed: 1.5"
    terrain-follow="maxStep: 0.5; smoothing: 0.15"
  >
    <a-camera
      look-controls="pointerLockEnabled: true"
      wasd-controls="enabled: false"
      position="0 1.6 0"
    >
      <a-cursor color="#ffeeaa" opacity="0.4" raycaster="enabled: false"></a-cursor>
    </a-camera>
    <a-entity oculus-touch-controls="hand: left"></a-entity>
    <a-entity oculus-touch-controls="hand: right"></a-entity>
  </a-entity>

  <!-- ===== SKY ===== -->
  <a-sky color="#7ec8e3"></a-sky>

  <!-- Sun -->
  <a-sphere position="40 60 -80" radius="6"
    color="#fff8e0"
    material="emissive:#fffacc; emissiveIntensity:1; shader:flat">
  </a-sphere>

  <!-- Clouds -->
  <a-sphere position="-25 28 -60" radius="5"  color="#ffffff" material="roughness:1; opacity:0.92; transparent:true"></a-sphere>
  <a-sphere position="-18 27 -60" radius="7"  color="#f8f8f8" material="roughness:1; opacity:0.88; transparent:true"></a-sphere>
  <a-sphere position="-10 29 -58" radius="4"  color="#ffffff" material="roughness:1; opacity:0.85; transparent:true"></a-sphere>
  <a-sphere position="15  26 -65" radius="6"  color="#f0f0f0" material="roughness:1; opacity:0.88; transparent:true"></a-sphere>
  <a-sphere position="22  28 -64" radius="4"  color="#ffffff" material="roughness:1; opacity:0.90; transparent:true"></a-sphere>
  <a-sphere position="30  25 -70" radius="8"  color="#f8f8f8" material="roughness:1; opacity:0.82; transparent:true"></a-sphere>

  <!-- ===== LIGHTING ===== -->
  <a-light type="directional" color="#fff5cc" intensity="1.8"
    position="6 12 4" cast-shadow="true"
    shadow-camera-left="-20" shadow-camera-right="20"
    shadow-camera-top="20"   shadow-camera-bottom="-20">
  </a-light>
  <a-light type="ambient"    color="#a8c8e8" intensity="0.9"></a-light>
  <a-light type="hemisphere" color="#d4e8a0" ground-color="#8aaa60" intensity="0.4"></a-light>

  <!-- ===== GROUND ===== -->
  <a-plane position="0 0 0" rotation="-90 0 0" width="120" height="120"
    color="#5a7a3a" material="roughness:1; metalness:0" shadow="receive:true">
  </a-plane>

  <!-- Grass patches -->
  <a-plane position="4  0.01  5"  rotation="-90 0  20" width="4" height="3" color="#4a7030" material="roughness:1; opacity:0.9; transparent:true"></a-plane>
  <a-plane position="-6 0.01  3"  rotation="-90 0 -10" width="3" height="4" color="#527838" material="roughness:1; opacity:0.8; transparent:true"></a-plane>
  <a-plane position="1  0.01 -8"  rotation="-90 0  40" width="5" height="3" color="#4e7434" material="roughness:1; opacity:0.9; transparent:true"></a-plane>
  <a-plane position="-8 0.01 -5"  rotation="-90 0  15" width="4" height="4" color="#4a6e30" material="roughness:1; opacity:0.85; transparent:true"></a-plane>
  <a-plane position="8  0.01 -3"  rotation="-90 0 -25" width="3" height="3" color="#567a3c" material="roughness:1; opacity:0.8; transparent:true"></a-plane>

  <!-- ===== TEMPLE STEPS ===== -->
  <a-box position="0 0.1 4"  width="10"  height="0.2" depth="2"   color="#c8b888" material="roughness:1" shadow="receive:true"></a-box>
  <a-box position="0 0.3 3"  width="9.2" height="0.2" depth="1.8" color="#c0b080" material="roughness:1" shadow="receive:true"></a-box>
  <a-box position="0 0.5 2"  width="8.5" height="0.2" depth="1.8" color="#b8a878" material="roughness:1" shadow="receive:true"></a-box>

  <!-- ===== TEMPLE FLOOR ===== -->
  <a-box position="0 0.6 -2" width="14" height="0.2" depth="12"
    color="#b0a070" material="roughness:1" shadow="receive:true">
  </a-box>
  <a-box position="-2 0.71 -1" width="0.05" height="0.02" depth="6"   color="#887050" material="roughness:1"></a-box>
  <a-box position="2  0.71 -1" width="0.05" height="0.02" depth="6"   color="#887050" material="roughness:1"></a-box>
  <a-box position="0  0.71  1" width="8"    height="0.02" depth="0.05" color="#887050" material="roughness:1"></a-box>
  <a-box position="0  0.71 -1" width="8"    height="0.02" depth="0.05" color="#887050" material="roughness:1"></a-box>
  <a-box position="0  0.71 -3" width="8"    height="0.02" depth="0.05" color="#887050" material="roughness:1"></a-box>

  <!-- ===== COLUMNS — LEFT ===== -->
  <a-cylinder position="-5 2.3 0"  radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0  2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <a-cylinder position="-5 2.3 -3" radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0  2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <a-cylinder position="-5 1.5 -6" radius="0.4" height="2.8" color="#a89860" material="roughness:1" rotation="0 0 8" shadow="cast:true">
    <a-cylinder position="0 -1.5 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <a-cylinder position="-6.5 0.82 -7.5" radius="0.4" height="2.5" color="#a89860" material="roughness:1" rotation="0 30 90" shadow="cast:true"></a-cylinder>

  <!-- ===== COLUMNS — RIGHT ===== -->
  <a-cylinder position="5 2.3 0"  radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0  2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <a-cylinder position="5 2.3 -3" radius="0.4" height="4.5" color="#c8b880" material="roughness:1" shadow="cast:true">
    <a-cylinder position="0  2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
    <a-cylinder position="0 -2.4 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>
  <a-cylinder position="5 1.9 -6" radius="0.4" height="3.5" color="#a89860" material="roughness:1" rotation="0 0 -5" shadow="cast:true">
    <a-cylinder position="0 -1.8 0" radius="0.52" height="0.3" color="#b8a870" material="roughness:1"></a-cylinder>
  </a-cylinder>

  <!-- ===== ARCHITRAVE ===== -->
  <a-box position="0 4.7 0"  width="11" height="0.5" depth="0.9" color="#b8a868" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="1 4.4 -3" width="9"  height="0.5" depth="0.9" color="#a89858" material="roughness:1" rotation="0 0 -4"></a-box>

  <!-- ===== BACK WALL ===== -->
  <a-box position="-3 2 -7.5"   width="5" height="4" depth="0.7" color="#a89858" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="4  1.5 -7.5" width="3" height="3" depth="0.7" color="#a08850" material="roughness:1"></a-box>
  <a-box position="-1   2.5 -7.1" width="0.08" height="4" depth="0.08" color="#3a8030" material="roughness:1" rotation="0 0 12"></a-box>
  <a-box position="-3.5 1.8 -7.1" width="0.08" height="3" depth="0.08" color="#448836" material="roughness:1" rotation="0 0 -8"></a-box>
  <a-box position="1.5  1.2 -7.1" width="0.08" height="2" depth="0.08" color="#3a7828" material="roughness:1" rotation="0 0  5"></a-box>

  <!-- ===== RUBBLE ===== -->
  <a-box position="-6.5 0.82 -7.5" width="1.5" height="0.8" depth="1.2" color="#908060" material="roughness:1" rotation="0 10  0" shadow="cast:true"></a-box>
  <a-box position="7    0.82 -7"   width="1.2" height="0.7" depth="1.0" color="#988868" material="roughness:1" rotation="0 20  0"></a-box>
  <a-box position="6    0.72 -6"   width="0.8" height="0.5" depth="0.8" color="#887858" material="roughness:1" rotation="0 40  0"></a-box>
  <a-box position="3    0.72  2"   width="1.2" height="0.5" depth="0.9" color="#908060" material="roughness:1" rotation="0 25  0" shadow="cast:true"></a-box>
  <a-box position="-4   0.72  1"   width="1.0" height="0.4" depth="0.8" color="#887858" material="roughness:1" rotation="0 10  5"></a-box>
  <a-box position="2    0.72 -4"   width="0.9" height="0.6" depth="0.7" color="#908060" material="roughness:1" rotation="0 60  0"></a-box>
  <a-box position="-3   0.72 -4"   width="1.1" height="0.5" depth="1.0" color="#887858" material="roughness:1" rotation="0 -15 3"></a-box>
  <a-box position="6    0.72 -1"   width="0.8" height="0.4" depth="0.9" color="#807050" material="roughness:1" rotation="0 45  0"></a-box>
  <a-box position="-6   0.72 -2"   width="1.0" height="0.5" depth="0.8" color="#807050" material="roughness:1" rotation="0 30 -5"></a-box>

  <!-- ===== ALTAR ===== -->
  <a-box position="0 0.9 -6" width="3"   height="0.6" depth="1.5" color="#a09060" material="roughness:1" shadow="cast:true"></a-box>
  <a-box position="0 1.3 -6" width="2.5" height="0.5" depth="1.2" color="#b0a070" material="roughness:1"></a-box>
  <a-sphere position="0 1.65 -6" radius="0.18"
    color="#ffd700"
    material="emissive:#ffaa00; emissiveIntensity:0.6; roughness:0; metalness:0.8"
    animation__float="property: position; to: 0 1.82 -6; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine"
    animation__spin="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
  </a-sphere>
  <a-light type="point" color="#ffcc44" intensity="0.5" distance="6" position="0 2.2 -6"
    animation="property: intensity; to: 0.9; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine">
  </a-light>

  <a-box position="-5.42 1.5  0" width="0.07" height="3" depth="0.07" color="#4a8830" material="roughness:1" rotation="0 0  8"></a-box>
  <a-box position="-4.58 2   -3" width="0.07" height="2" depth="0.07" color="#508a34" material="roughness:1" rotation="0 0 -5"></a-box>
  <a-box position="5.42  1.5  0" width="0.07" height="3" depth="0.07" color="#4a8030" material="roughness:1" rotation="0 0 -8"></a-box>
  <a-box position="4.58  2   -3" width="0.07" height="2" depth="0.07" color="#4a8830" material="roughness:1" rotation="0 0  4"></a-box>

  <a-sphere   position="-9  7.5 -4" radius="1.8"  color="#285818" material="roughness:1"></a-sphere>

  <a-cylinder position="10  3   -3" radius="0.35" height="6"  color="#4a3020" material="roughness:1" shadow="cast:true"></a-cylinder>

  <a-sphere   position="11  6   -2" radius="2.0"  color="#387030" material="roughness:1"></a-sphere>

</script>
